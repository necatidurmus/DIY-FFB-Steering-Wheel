[platformio]
default_envs = f401rct6

[env:f401rct6]
platform = ststm32@19.5.0
board = f401rct6_wheel
framework = arduino
upload_protocol = dfu
monitor_speed = 115200
test_ignore = *
test_framework = custom

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D F401_RCT6_USB_CDC=1
    -D I2C_TIMEOUT_TICK=5
    -D FLASH_DATA_SECTOR=5
    -D FLASH_BASE_ADDRESS=0x08020000
    -D FLASH_PAGE_SIZE=1024
    -D USB_PRODUCT_STRING=\"F401_FFB_Wheel_CDC\"
    -Wall
    -Wextra

monitor_filters = time

; Native USB kullanilmayan tanilama yapisi. PA2=TX, PA3=RX (USART2).
[env:f401rct6_uart]
extends = env:f401rct6
build_unflags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D F401_RCT6_USB_CDC=1
build_flags =
    -D I2C_TIMEOUT_TICK=5
    -D FLASH_DATA_SECTOR=5
    -D FLASH_BASE_ADDRESS=0x08020000
    -D FLASH_PAGE_SIZE=1024
    -Wall
    -Wextra

[env:f401rct6_dfu]
extends = env:f401rct6
upload_protocol = dfu

; SWD yalniz debug/kurtarma icindir; normal firmware yukleme yolu USB ROM DFU'dur.
[env:f401rct6_stlink]
extends = env:f401rct6
upload_protocol = stlink
debug_tool = stlink

[env:native]
platform = native@1.2.1
test_build_src = false
test_ignore =
test_framework = custom
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -Wshadow
    -Wconversion
